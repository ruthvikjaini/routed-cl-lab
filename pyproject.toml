[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routed-cl-lab"
version = "0.1.0"
description = "Routed continual learning for LLM agents: reproduce and extend Philip et al. (arXiv:2610.38796) on a synthetic heterogeneous stream"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
